[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmstxt-lint"
version = "0.2.0"
description = "Zero-dependency linter for llms.txt and llms-full.txt files (CLI, GitHub Action, pre-commit, SARIF)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["llms.txt", "llms-full.txt", "linter", "ai", "documentation"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Environment :: Console"]

[project.scripts]
llmstxt-lint = "llmstxt_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/Fuji643/llmstxt-lint"
Documentation = "https://github.com/Fuji643/llmstxt-lint/blob/main/docs/rules.md"
Issues = "https://github.com/Fuji643/llmstxt-lint/issues"
Changelog = "https://github.com/Fuji643/llmstxt-lint/blob/main/CHANGELOG.md"
