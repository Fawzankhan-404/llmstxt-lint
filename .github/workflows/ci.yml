name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest -q
      - run: llmstxt-lint examples/good.txt --strict
  action:
    name: Self-test the GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          files: examples/good.txt
          args: --strict
          sarif: results.sarif
      - run: test -s results.sarif
      - name: Action must fail on bad input
        id: bad
        continue-on-error: true
        uses: ./
        with:
          files: examples/bad.txt
      - run: test "${{ steps.bad.outcome }}" = "failure"
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - name: Hook passes on a valid llms.txt and fails on an invalid one
        run: |
          mkdir -p t/ok t/bad
          cp examples/good.txt t/ok/llms.txt
          cp examples/bad.txt t/bad/llms.txt
          pre-commit try-repo . llmstxt-lint --files t/ok/llms.txt
          if pre-commit try-repo . llmstxt-lint --files t/bad/llms.txt; then exit 1; fi
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
